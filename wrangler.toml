name = "paid-funnel-simple-form-funnel"
main = "./src/worker.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
META_GRAPH_API_VERSION = "v26.0"

[[kv_namespaces]]
binding = "FUNNEL_SESSIONS"
id = "00000000000000000000000000000001"

[[d1_databases]]
binding = "FUNNEL_DB"
database_name = "paid-funnel-events"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[queues.producers]]
binding = "CAPI_RETRY_QUEUE"
queue = "paid-funnel-capi-retries"

[[queues.consumers]]
queue = "paid-funnel-capi-retries"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100
dead_letter_queue = "paid-funnel-capi-dead-letter"
